const ART=(b)=>`<div class="box s"><b>STOP and GO</b><br>Before cars were invented, horse-drawn carriages were allowed to circulate freely. There were no signs to ${b?"<b>":""}control${b?"</b>":""} traffic and no speed ${b?"<b>":""}limits${b?"</b>":""}. As cars started to appear on the streets, rules that would ${b?"<b>":""}permit${b?"</b>":""} traffic to flow safely were desperately needed. In 1903, William Eno published “Rules for Driving” – the first official traffic code. Drivers had to drive on the right, they were supposed to show other drivers when they wanted to turn, and they were ${b?"<b>":""}prohibited${b?"</b>":""} from parking on the left. His greatest innovations were the traffic circle and one-way streets, which ${b?"<b>":""}obliged${b?"</b>":""} all traffic to travel in the same direction. He also helped introduce crosswalks to protect pedestrians. At the same time, new laws ${b?"<b>":""}required${b?"</b>":""} vehicles to be ${b?"<b>":""}registered${b?"</b>":""} and have license plates and also ${b?"<b>":""}banned${b?"</b>":""} drivers under sixteen, though drivers did not have to take a driving test until 1934. The most curious thing about Eno, the father of road safety, was that he never learned to drive a car!<br><small>GLOSSARY: license plate (n) a sign on a car that shows its registration number</small></div>`;

add("1 LANGUAGE IN CONTEXT · SET THE CONTEXT","Cars and the road",`<div class="t"><p>Think about your city 100 years ago.</p><p>1 How did people travel?<br>2 Were there traffic rules?<br>3 Who made the first rules for drivers?</p></div>`,`Set the context before reading. Pairs discuss 2 min, then whole-class feedback. Accept all ideas; do not correct. Lead into the text: "Now let’s read about the man who made the first rules." ICQ: "Do we read now?" (Not yet, we talk first.)`);
add("1 LANGUAGE IN CONTEXT · READING FOR GIST","B",`<p class="s"><b>B</b> Read this article about William Eno. What’s the connection with the pictures above?</p>${ART(1)}<p class="s"><i class="h">Eno created the traffic rules and ideas in the pictures: one-way streets, the traffic circle and crosswalks.</i></p>`,`Gist task, 2 min, silent reading. Set a short time limit; Ss compare in pairs, then whole-class feedback; Reveal the gist answer. Do not explain bold words yet. ICQ: "Do you read every word?" (No, just the main idea.)`);
add("1 LANGUAGE IN CONTEXT · DETAILED READING","C",`<p class="s"><b>C</b> Read the article again. Check (✓) the statements that you can infer from the text. Find information in the text to support your answers and <u>underline</u> it.</p><table class="s"><tr><td>1</td><td>Before cars, there were very few problems with traffic in big cities like New York.</td><td><i class="h">✗</i></td></tr><tr><td>2</td><td>There was no traffic code before cars.</td><td><i class="h">✓</i></td></tr><tr><td>3</td><td>Eno’s “Rules for Driving” included more than just rules for drivers.</td><td><i class="h">✓</i></td></tr><tr><td>4</td><td>Eno was not physically able to drive a car.</td><td><i class="h">✗</i></td></tr></table>`,`Pairs check, then Reveal. Ask for the supporting evidence: 2 "the first official traffic code"; 3 "crosswalks to protect pedestrians", "vehicles registered". 1 not stated; 4 he "never learned" – not the same as "not able". Check the key against your book.`);
add("2 VOCABULARY · FIND THE WORDS","Prohibition, permission, obligation",`<p class="s">Read the article again. Circle the words related to prohibition, permission, and obligation.</p>${MK(ART(0))}<p class="s"><i class="h" data-g="p">${ic("ok")}Permission: permit</i><br><i class="h" data-g="x">${ic("no")}Prohibition: prohibited, banned</i><br><i class="h" data-g="o">${ic("must")}Obligation: obliged, required</i></p>`,`The article has no bold words. Students read again and circle the words related to prohibition, permission and obligation (pairs, 3 min). Reveal shows one group per click: elicit each group first, then press Reveal. ICQ: "Do we circle every word?" (No, only words about rules: not allowed, allowed, must.) The next slide pre-teaches these words with MPF.`);
add("2 VOCABULARY · PRE-TEACH","Meaning",`<div class="s"><p>Look at the words in the article.</p><p>${ic("rule")}no signs to <mark>control</mark> traffic<br>${ic("no")}laws <mark>banned</mark> drivers under sixteen<br>${ic("rule")}vehicles had to be <mark>registered</mark><br>${ic("must")}laws <mark>required</mark> vehicles to be registered</p></div>`,`MPF for each word. MEANING: use the sentence. CCQs: ban – "Can a driver under sixteen drive?" (No.) required – "Is it a choice?" (No, you must.) register – "Do you write the car’s name and number on an official list?" (Yes.) control – "Do rules help manage the traffic?" (Yes.) PRONUNCIATION: model and drill chorally, then individually; mark stress: CONtrol (n/v: conTROL), perMIT (v) / PERmit (n), obLIGE, reQUIRE, REgister, ban, proHIBit. FORM: say the part of speech; show noun forms: obligation, permission, prohibition, registration, requirement.`);
add("2 VOCABULARY · CHART","A",`<p class="s"><b>A</b> Complete the chart. What idea do the words express? Write <b>M</b> (must), <b>A</b> (allowed), <b>N</b> (not allowed), or <b>R</b> (rules apply). Listen and check.</p><div class="wd s"><span>${ic("must")}M must</span><span>${ic("ok")}A allowed</span><span>${ic("no")}N not allowed</span><span>${ic("rule")}R rules apply</span></div><div class="cols s"><table><tr><th>verb</th><th>noun</th><th>meaning</th></tr><tr><td>${B("ban")}</td><td>ban</td><td><i class="h">N</i></td></tr><tr><td>control</td><td>${B("control")}</td><td>R</td></tr><tr><td>limit</td><td>${B("limit")}</td><td><i class="h">R</i></td></tr><tr><td>${B("oblige")}</td><td>obligation</td><td><i class="h">M</i></td></tr></table><table><tr><th>verb</th><th>noun</th><th>meaning</th></tr><tr><td>${B("permit")}</td><td>permission</td><td><i class="h">A</i></td></tr><tr><td>${B("prohibit")}</td><td>prohibition</td><td><i class="h">N</i></td></tr><tr><td>register</td><td>${B("registration")}</td><td><i class="h">R</i></td></tr><tr><td>${B("require")}</td><td>requirement</td><td><i class="h">M</i></td></tr></table></div>`,`Pairs complete the chart (3 min), then play audio 2.24 and check. Reveal. Drill the noun/verb pairs. Check the key against the audio.<br><b>What does R (rules apply) mean?</b> M, A and N say what a person must, may or may not do. R is different: the word describes how an authority applies or manages the rules, not a single order. Examples: <i>control</i> traffic, <i>limit</i> speed, <i>register</i> a vehicle. Here the rules are in use, but the word does not say must / allowed / not allowed. CCQs: "Does <i>limit</i> tell you what you must do?" (No, it sets a maximum that rules apply to.) "Does <i>register</i> say you can or cannot drive?" (No, it is the official process the rules require.) Contrast: <i>require</i> = M (you must), <i>ban</i> = N (you cannot).`);
add("2 VOCABULARY · CONTROLLED PRACTICE","A",`<p class="s"><b>A</b> Work in pairs. Choose the correct form of the word to complete the sentence.</p><p class="s">1 You have an <i>oblige / obligation</i> to tell the truth in a courthouse. <i class="h">→ obligation</i><br>2 I <i>permit / permission</i> you to take photos in the arts center. <i class="h">→ permit</i><br>3 There is a <i>prohibit / prohibition</i> against running on the boardwalk. <i class="h">→ prohibition</i><br>4 You can go to city hall to <i>register / registration</i> your vehicle. <i class="h">→ register</i><br>5 Having a driver’s license is a <i>require / requirement</i> to drive a car. <i class="h">→ requirement</i></p>`,`Pairs 3 min. Feedback: ask for the reason (noun after "an/a", verb after "to"/subject "I"). Reveal.`);
add("2 VOCABULARY · CONTROLLED PRACTICE","B",`<p class="s"><b>B</b> Work in pairs. Circle <u>all</u> of the words that can be used to fill in the blank for each sentence.</p>${cards()}`,`Pairs 3 min. Whole-class check; ask why the other words do not fit. Check the key against the book (item 1 "control" may be accepted by your answer key).`);
add("2 VOCABULARY · CONTROLLED PRACTICE · A","TALKING ABOUT RULES (PAGE 89)",`<p class="t"><b>A</b> Choose the correct word to complete the sentences.</p><div class="t"><p>1 Speed limit signs are used to <i>control / prohibit</i> traffic within the downtown area. <i class="h">→ control</i></p><p>2 You cannot park your car here unless you have <i>obligation / permission</i> from the central office. <i class="h">→ permission</i></p><p>3 All guests are required to <i>limit / register</i> at reception on arrival. <i class="h">→ register</i></p><p>4 There is a <i>ban / requirement</i> on all ball sports in all residential areas. <i class="h">→ ban</i></p></div>`,`Individual work 3 min, then pairs check. Each Reveal click shows one answer: elicit it first. Ask why (meaning and form).`);
add("2 VOCABULARY · CONTROLLED PRACTICE · B","TALKING ABOUT RULES (PAGE 89)",`<p class="t"><b>B</b> Complete the sentences with the correct form of the word in parentheses ( ).</p><div class="t"><p>1 Swimming in the lake is strictly ${B("prohibited")} (prohibit) at all times.</p><p>2 You must consider all the legal ${B("requirements")} (require) when starting a business.</p><p>3 Click here to start your ${B("registration")} (register) process.</p><p>4 The bus is ${B("limited")} (limit) to 50 passengers!</p></div>`,`Individual work 3 min, then pairs check. Each Reveal click shows one answer: elicit it first. Note: the book key shows "requirement" for item 2; "requirements" fits "all the legal ...", check with your key.`);
add("2 VOCABULARY · FREER PRACTICE","SPEAKING",`<p class="t"><b>C</b> <span class="tag">GROUP WORK</span> What are three problems caused by traffic where you live? Suggest solutions for each of the problems. For ideas, watch Nicolle’s video.</p>`,`Groups of 3–4, 6 min. Monitor for the target words (ban, control, limit, require, permit, prohibit). Note errors on the board; delayed feedback after the task. Play Nicolle’s video only if available.`);
add("3 GRAMMAR · ELICIT THE RULE","A",`<p class="s"><b>A</b> Complete the sets. Use the sentences in the grammar box to help you. Then decide which set each example sentence belongs to: A, B, or C.<br>A ${ic("no")} To express prohibition in the past: couldn’t, ${B("were not allowed to")}<br>B ${ic("ok")} To express permission in the past: could, ${B("were allowed to")}<br>C ${ic("must")} To express obligation in the past: had to, ${B("were required to")}</p><div class="box s"><b>Prohibition, permission, obligation (past)</b><br>Carriages were allowed to circulate freely before 1903. <b>B</b><br>Eno’s rules said that drivers had to drive on the right. <i class="h">C</i><br>They were not allowed to stop in the middle of the street. <i class="h">A</i><br>Pedestrians were required to cross at the crosswalk. <i class="h">C</i></div>`,`Use the article sentences from the reading (same text): "Drivers had to drive on the right", "prohibited from parking on the left". Elicit: Is it about now or the past? Does it say "you must" or "you can" or "you can’t"? Pairs sort sentences, then Reveal. CCQ: "Were pedestrians free to choose?" (No: obligation.)`);
add("3 GRAMMAR · HIGHLIGHT","Prohibition, permission, obligation (past)",`<p class="s">We can use a range of expressions to talk about permission, prohibition, and obligation in the past.</p><table class="s"><tr><td>${ic("ok")}<b>Permission</b></td><td><mark>could, were allowed to</mark></td></tr><tr><td>${ic("no")}<b>Prohibition</b></td><td><mark>couldn’t, were not allowed to</mark></td></tr><tr><td>${ic("must")}<b>Obligation</b></td><td><mark>had to, were required to, were supposed to</mark><br><small>note: <i>were required to</i> is stronger than <i>were supposed to</i></small></td></tr></table>`,`Highlight the forms (yellow). Form: could / couldn’t / had to + base verb; were (not) allowed / required / supposed + to + base verb. Pronunciation: "allowed to" /əˈlaʊd tə/, "had to" /hæt tə/, "supposed to" /səˈpoʊst tə/; drill with linking and weak "to". CCQs: "Which is stronger, required or supposed?" (required.) "Was it a rule or a choice?"`);
add("3 GRAMMAR · CLARIFY","Accuracy check",`<div class="box s"><b>ACCURACY CHECK</b><br>Prohibition and permission are usually expressed in the passive because the person / authority responsible for the law is known and doesn’t need to be named.<br><br>City regulations allow cars to park here. <i>(correct, but authority is known)</i><br>Cars are allowed to park here.</div>`,`Clarify: passive when we do not name the authority. Concept check: "Do we say WHO made the rule?" (No.) Ask Ss to turn one active sentence into passive.`);
add("3 GRAMMAR · CONTROLLED PRACTICE","A",`<p class="s"><b>A</b> Complete the sentences using an appropriate expression from the grammar chart.<br>1 When we were kids, we ${B("weren’t allowed to / couldn’t")} stay up after 10 o’clock. If we did, we got in trouble.<br>2 At school, we ${B("were required to / had to")} wear a uniform at all times. They were very strict about it.<br>3 When I was in high school, I ${B("couldn’t / wasn’t allowed to")} play video games on school nights before I did my homework.<br>4 When I was a teenager, I ${B("was supposed to")} come home by nine o’clock on weekends, but sometimes I stayed out later.</p>`,`Individual 3 min, pairs check. Each Reveal click shows one answer: elicit it first. Several answers are possible; item 4 needs "was supposed to" because the rule was often broken.`);
add("3 GRAMMAR · FREER PRACTICE","C",`<p class="t"><b>C</b> <span class="tag">GROUP WORK</span> Write three rules from your childhood. Use three different structures from the grammar box, and check your accuracy. Read your rules to the group. Whose parents were the strictest?</p>`,`Individual writing 3 min (3 rules, 3 different structures), then check accuracy in pairs. Groups read their rules aloud and decide whose parents were the strictest. Monitor, note errors; delayed correction.`);
add("3 GRAMMAR · FREER PRACTICE","CHILDHOOD RULES",`<p class="s">Answer questions about what rules you had to follow as a child. Add additional questions about rules to the list. Ask your partner what rules they had to follow. Use modals of permission, obligation, and prohibition.</p><table class="s"><tr><th>Did you …</th><th>You</th><th>Your partner</th></tr>${["stay out after dark?","play video games all day?","have candy and soda?","go on dates in high school?","do chores around the house?","wake up early?","get a job in high school?","wear a uniform at school?","","","",""].map(q=>`<tr><td>${q||"______________________"}</td><td>Yes &nbsp; No</td><td>Yes &nbsp; No</td></tr>`).join("")}</table>`,`Students answer for themselves, add 4 questions of their own, then interview a partner and tick Yes/No. Model one question first: "Did you have to wake up early?" Monitor for past modals; delayed correction.`);
add("4 SPEAKING","A",`<p class="t"><b>A</b> <span class="tag">GROUP WORK</span> Read the laws. Three of them were real laws in the past. Which is the fake law? Why do you think parents passed the real laws?</p><div class="t"><p>1 You couldn’t drink soda on Sunday.</p><p>2 All men were required to grow beards.</p><p>3 Female school teachers were not allowed to get married.</p><p>4 Only people who weighed more than 100 pounds (45 kilograms) could vote in elections.</p></div>`,`Groups 5 min; whole-class vote. Check the answer in your book. Encourage past modals. Delayed error correction.`);
add("4 SPEAKING","B",`<p class="t"><b>B</b> Do you know any old laws from your country? Go online and find out if they are still laws. Find some strange laws from other countries, too.</p>`,`Students share old laws from their country. Set the online research as follow-up. Finish with delayed error correction.`);
S.forEach(x=>{if(x.tag.includes("FIND THE WORDS")||(x.tag.includes("CONTROLLED")&&(x.title.startsWith("TALKING ABOUT")||x.tag.startsWith("3 GRAMMAR"))))x.step=1});
let i=0;const root=document.getElementById("sl");
root.innerHTML=S.map(s=>{const m=MAP.find(x=>s.tag.includes(x[0]));const c=CH(s.body);if(/LEAD-IN|SET THE CONTEXT|ELICIT/.test(s.tag))c.unshift(["pairs","Pairs"]);return `<section class="sl"><span class="tag">${s.tag}</span>${c.map(x=>`<span class="ck">${ic(x[0])}${x[1]}</span>`).join("")}<div class="hd">${m?`<span class="ic">${ic(m[1])}</span>`:""}<h1>${s.title}</h1></div>${s.body}</section>`}).join("");
const els=[...root.children];
function show(){document.getElementById("rb").textContent=S[i].step?"Reveal next":"Reveal";document.getElementById("ntd").innerHTML=S[i].notes;els.forEach((e,k)=>e.classList.toggle("on",k==i));document.getElementById("c").textContent=(i+1)+" / "+S.length;document.getElementById("p").style.width=((i+1)/S.length*100)+"%"}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));show()}
function rv(){const e=els[i];if(!S[i].step){e.classList.toggle("show");return}const n=[...e.querySelectorAll(".h")].find(x=>!x.classList.contains("r"));if(n){n.classList.add("r");const g=n.dataset.g;if(g)e.querySelectorAll('.mk[data-g="'+g+'"]').forEach(m=>m.classList.add("r"))}else e.querySelectorAll(".r").forEach(x=>x.classList.remove("r"))}
addEventListener("keydown",e=>{if(e.key=="ArrowRight")go(1);if(e.key=="ArrowLeft")go(-1);if(e.key=="r"||e.key=="R")rv()});show();
</script></body></html>
